<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node Farm</title>
    <!-- linked to custom css style -->
    <link rel="stylesheet" type="text/css" href="../styles/overview-styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>🌽 Node Farm 🥬</h1>
      <div class="cards-container">
        <figure class="card">
          <div class="card_emoji">🥑🥑</div>
          <div class="card_title-box">
            <h2 class="card_title">Fresh Avocado</h2>
          </div>
          <div class="card_details">
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--organic">Organic!</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail">4 🥑 per 📦</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--price">£6.50</h6>
            </div>
          </div>
          <a href="#" class="card_link">
            <span>Detail<i class="emoji-right">👉</i></span>
          </a>
        </figure>
        <figure class="card">
          <div class="card_emoji">🧀🧀</div>
          <div class="card_title-box">
            <h2 class="card_title">Goat and Sheep Cheese</h2>
          </div>
          <div class="card_details">
            <div class="card_details-box">
              <h6 class="card_detail">250g per 📦</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--price">£5.00</h6>
            </div>
          </div>
          <a href="#" class="card_link">
            <span>Detail<i class="emoji-right">👉</i></span>
          </a>
        </figure>
        <figure class="card">
          <div class="card_emoji">🥦🥦</div>
          <div class="card_title-box">
            <h2 class="card_title">Apollo Broccoli</h2>
          </div>
          <div class="card_details">
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--organic">Organic!</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail">3 🥦 per 📦</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--price">£5.50</h6>
            </div>
          </div>
          <a href="#" class="card_link">
            <span>Detail<i class="emoji-right">👉</i></span>
          </a>
        </figure>
        <figure class="card">
          <div class="card_emoji">🥕🥕</div>
          <div class="card_title-box">
            <h2 class="card_title">Baby Carrots</h2>
          </div>
          <div class="card_details">
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--organic">Organic!</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail">20 🥕 per 📦</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--price">£3.00</h6>
            </div>
          </div>
          <a href="#" class="card_link">
            <span>Detail<i class="emoji-right">👉</i></span>
          </a>
        </figure>
        <figure class="card">
          <div class="card_emoji">🌽🌽</div>
          <div class="card_title-box">
            <h2 class="card_title">Sweet Corncobs</h2>
          </div>
          <div class="card_details">
            <div class="card_detail-box">
              <h6 class="card_detail">🌽 per 📦</h6>
            </div>
            <div class="card_detail-box">
              <h6 class="card_detail card_detail--price">£2.00</h6>
            </div>
          </div>
          <a href="#" class="card_link">
            <span>Detail<i class="emoji-right">👉</i></span>
          </a>
        </figure>
      </div>
    </div>
  </body>
</html>
